
name: Build PRDA ST APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          echo "ZIP files:"
          find . -maxdepth 2 -type f -name "*.zip"
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP file not found"
            exit 1
          fi
          unzip -o "$ZIP_FILE"
          test -f settings.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PRDA_ST_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

