
name: PRDA ST Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          mkdir -p "$RUNNER_TEMP/prda-app"
          unzip -oq "$ZIP_FILE" -d "$RUNNER_TEMP/prda-app"
          test -f "$RUNNER_TEMP/prda-app/settings.gradle"
          test -f "$RUNNER_TEMP/prda-app/app/build.gradle"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        shell: bash
        run: |
          gradle --no-daemon -p "$RUNNER_TEMP/prda-app" :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PRDA_ST_INSTALL_APK
          path: ${{ runner.temp }}/prda-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
