name: PRDA ST APK Easy Build

on:
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Get files
        uses: actions/checkout@v4
      - name: Unpack Android project
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo 'ERROR: No ZIP project file in repository root.'
            ls -la
            exit 1
          fi
          echo "Found: $ZIP_FILE"
          unzip -oq "$ZIP_FILE"
          test -f settings.gradle
          test -f app/build.gradle
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: PRDA_ST_INSTALL_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
